name: Release — app desktop (Electron)

# Cada tag v* (ex.: v0.1.0) compila o app para Windows/Linux/macOS e publica no Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # sem cache: npm — o cache exige package-lock.json, que ainda não está commitado

      - name: Instala dependências
        run: npm install --no-audit --no-fund

      - name: Dependências de empacotamento (só Linux — AppImage precisa de libfuse2, .deb de fakeroot)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 fakeroot

      - name: Compila e publica no Release do GitHub
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem certificado de code signing: gera binários não assinados (SmartScreen avisa no 1º download).
          CSC_IDENTITY_AUTO_DISCOVERY: false
